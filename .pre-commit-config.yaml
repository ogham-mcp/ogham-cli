# Hook config for ogham-cli.
#
# THE RUNNER IS `prek`, NOT `pre-commit`.
#
#   brew install prek
#   prek install          # writes .git/hooks/pre-commit
#   prek run --all-files  # run everything now
#
# prek is a drop-in-compatible Rust reimplementation, so this file keeps
# the standard filename and schema -- which is exactly why the runner
# needs stating here. Reading the config alone leads you to install
# `pre-commit`, and someone did that on 2026-08-18 (TBU-255).
#
# The two Go scanners at the bottom are the slow ones: `prek run
# --all-files` takes minutes, dominated by their `go run ...@latest`
# compile. If that ever becomes a reason to reach for --no-verify,
# move them to pre-push rather than deleting them -- an unexecuted
# hook is worse than no hook, which is how GO-2026-5970 shipped.
repos:
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-vet
      - id: go-build
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      - id: golangci-lint
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
  # Broad-spectrum secret scanner -- parity with the Python MCP config.
  # Catches what detect-private-key misses: postgres/mysql connection strings
  # with passwords, cloud API keys (AWS, GitHub, Anthropic, OpenAI, Supabase
  # sb_secret_, Neon npg_, Stripe sk_), and ~160 other token patterns.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # gosec -- Go SAST. Catches hardcoded credentials, weak crypto,
  # unvalidated SQL, file permission issues, etc. G104 excluded because
  # errcheck (in golangci-lint) already covers it with better nolint
  # integration. Run via `go run` so the version tracks the Makefile's
  # `security-scan` target rather than drifting in the pre-commit cache.
  - repo: local
    hooks:
      - id: gosec
        name: gosec (Go SAST)
        # Pinned, not @latest: a floating version means a commit can start
        # failing because an upstream tool changed, with no repo change --
        # the problem TBU-234 pinned out of CI. Bump deliberately.
        entry: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.9 -quiet -exclude=G104 ./...
        language: system
        types: [go]
        pass_filenames: false

  # govulncheck -- Go's official known-CVE scanner. Checks both direct
  # deps and stdlib. Runs on every commit so a dependency advisory
  # surfaces before it lands on main.
  - repo: local
    hooks:
      - id: govulncheck
        name: govulncheck (known CVEs)
        # Pinned for the same reason as gosec above. NOTE: the CVE
        # database is fetched at run time, so pinning the tool does not
        # freeze what it knows -- new advisories still surface.
        entry: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        language: system
        types: [go]
        pass_filenames: false
