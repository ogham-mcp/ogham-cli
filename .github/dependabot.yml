# Weekly dependency updates. Before this file existed nothing proposed
# updates: on 2026-10-07 five direct and 72 indirect Go modules were behind
# (govulncheck clean, so drift rather than exposure).
#
# Minor and patch bumps are grouped into one PR per ecosystem so a week's
# updates are one review. Go MAJOR upgrades are deliberately left ungrouped:
# each arrives as its own PR, because a major is an API change that needs a
# real read, not a batch approval.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
