name: release

# Fires on any vX.Y.Z tag push. Manual tag → everything else happens here.
# See docs/release-v0.4.md for the full release playbook.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write          # for creating the GitHub release
  packages: write          # for publishing container images (not used yet)

# Opt the JS-based actions (checkout, setup-go, goreleaser-action)
# into Node.js 24 ahead of the June 2026 default switch. Silences the
# deprecation warning and matches what the runner will use once v24
# ships as default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests before release
        run: go test ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned: `latest` made the build tool itself a floating
          # dependency inside an already-floating action (TBU-234).
          version: "~> v2.17"
          args: release --clean
        env:
          # Default GITHUB_TOKEN publishes the release on this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Homebrew tap push is disabled for v0.4.0 (see .goreleaser.yml
          # brews stanza -- commented out). Re-introduce GORELEASER_TAP_TOKEN
          # here when the tap is reactivated in v0.4.1+.
